name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
      - package-lock.json
      - packages/moonshine-darwin-arm64/package.json
      - packages/moonshine-darwin-x64/package.json
      - packages/*/CHANGELOG.md

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Known automation accounts are exempt so the release pipeline keeps working:
    # - github-actions[bot] opens the release-please PR via GITHUB_TOKEN
    # - dependabot[bot] opens dependency update PRs
    # Other authors (human or bot) must raise PRs through `git push no-mistakes`.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if ! printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            {
              echo "::error::This PR was not raised through no-mistakes."
              echo
              echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
              echo "That pipeline runs the required review/test/lint/CI steps and writes a"
              echo "deterministic '## Pipeline' section into the PR body containing:"
              echo
              echo "    $marker"
              echo
              echo "See CONTRIBUTING.md for setup and the full workflow."
              echo
              echo "PR author: ${PR_AUTHOR}"
            } >&2
            exit 1
          fi
          echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
          python3 <<'PY'
          import json
          import os
          import sys

          body = os.environ.get("PR_BODY") or ""
          prefix = "<!-- no-mistakes-pipeline-attestation:v1"
          version_floor = (
              "This repository requires no-mistakes >= 1.46.0 "
              "(https://github.com/kunchenguid/no-mistakes/pull/670). "
              "Older no-mistakes that only writes the signature is not enough."
          )


          def fail_attestation(headline, extra_lines):
              print(f"::error::{headline}", file=sys.stderr)
              print(file=sys.stderr)
              for line in extra_lines:
                  print(line, file=sys.stderr)
              print(file=sys.stderr)
              print("See CONTRIBUTING.md for setup and the full workflow.", file=sys.stderr)
              sys.exit(1)


          idx = body.find(prefix)
          if idx < 0:
              fail_attestation(
                  "This PR is missing structured no-mistakes pipeline attestation.",
                  [
                      version_floor,
                      "Raise the PR with 'git push no-mistakes' so the body includes:",
                      "",
                      '    <!-- no-mistakes-pipeline-attestation:v1 {"head_sha":"...","steps":[...]} -->',
                  ],
              )

          rest = body[idx + len(prefix) :]
          end = rest.find("-->")
          if end < 0:
              fail_attestation(
                  "This PR has an unparseable no-mistakes pipeline attestation comment.",
                  [version_floor, "The v1 comment is present but the JSON payload is not parseable."],
              )

          raw = rest[:end].strip()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              fail_attestation(
                  "This PR has an unparseable no-mistakes pipeline attestation comment.",
                  [version_floor, "The v1 comment is present but the JSON payload is not parseable."],
              )

          if not isinstance(data, dict):
              fail_attestation(
                  "This PR has an unparseable no-mistakes pipeline attestation comment.",
                  [version_floor, "The v1 comment is present but the JSON payload is not parseable."],
              )

          head_sha = data.get("head_sha")
          steps = data.get("steps")
          if not isinstance(head_sha, str) or not head_sha.strip() or not isinstance(steps, list):
              fail_attestation(
                  "This PR has an unparseable no-mistakes pipeline attestation comment.",
                  [
                      version_floor,
                      "The v1 comment must contain JSON with non-empty head_sha and a steps array.",
                  ],
              )

          required = ("review", "test", "document")
          status_by_step = {}
          for item in steps:
              if not isinstance(item, dict):
                  continue
              name = item.get("step")
              status = item.get("status")
              if name in required and name not in status_by_step:
                  status_by_step[name] = status if isinstance(status, str) else None

          bad = []
          for name in required:
              status = status_by_step.get(name)
              if status != "completed":
                  label = status if isinstance(status, str) and status else "missing"
                  bad.append(f"{name} status={label}")

          if bad:
              fail_attestation(
                  "no-mistakes pipeline attestation is missing required completed steps.",
                  [
                      "This repository requires review, test, and document to complete. "
                      "Quota skips and agent skips are non-compliant.",
                      "Required steps that are not completed:",
                      *[f"    {item}" for item in bad],
                      "",
                      "Re-run 'git push no-mistakes' without skipping those steps.",
                  ],
              )

          print(
              "Found valid no-mistakes pipeline attestation with review, test, and document completed."
          )
          PY
