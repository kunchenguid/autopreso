name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # release-please opens its release PR with GITHUB_TOKEN, which creates a
    # pull_request run that can only sit in action_required. Its output set is
    # exactly these files, so excluding them means no run is ever created.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
      - package-lock.json
      - packages/moonshine-darwin-arm64/package.json
      - packages/moonshine-darwin-x64/package.json
      - packages/*/CHANGELOG.md

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
